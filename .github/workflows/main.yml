name: run-xray-tests

on:
  workflow_dispatch:
    inputs:
      testPlanKey:
        description: 'Xray Test Plan'
        required: false

jobs:
  test_job:
    runs-on: ubuntu-latest

    env:
      XRAY_CLIENT_TOKEN: ${{ secrets.XRAY_CLIENT_TOKEN }}
      PROJECT_KEY: "YOURPROJECT"   # ← Replace with your Jira project key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies (example)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Run dummy tests to generate results.xml
        run: |
          echo "<testsuite name='dummy'><testcase classname='demo' name='test1'></testcase></testsuite>" > results.xml

      - name: Upload results to Xray
        run: |
          curl -X POST \
            -H "Content-Type: multipart/form-data" \
            -H "Authorization: Bearer $XRAY_CLIENT_TOKEN" \
            -F "file=@results.xml" \
            "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=$PROJECT_KEY"
