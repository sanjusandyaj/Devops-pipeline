name: CI - Jest + Xray Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      testExecKey:
        description: "Xray Test Execution Key (optional)"
        required: false
      projectKey:
        description: "Jira Project Key"
        required: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Checkout repository
    - name: Checkout repo
      uses: actions/checkout@v3

    # Set up Node (use stable LTS)
    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: 20

    # Install dependencies
    - name: Install dependencies
      run: npm install

    # Run Jest tests + generate JUnit report
    - name: Run Jest tests
      env:
        JEST_JUNIT_OUTPUT: jest-report.xml
      run: |
        npm test -- --ci --reporters=default --reporters=jest-junit

    # Show generated report
    - name: Show test report
      run: cat jest-report.xml

    # Upload test results to Xray
    - name: Import results to Xray
      uses: mikepenz/xray-action@v2.3.0
      with:
        username: ${{ secrets.JIRA_USERNAME }}
        password: ${{ secrets.JIRA_PASSWORD }}
        xrayCloud: "false"
        xrayBaseUrl: ${{ secrets.JIRA_BASEURL }}
        testFormat: "junit"
        testPaths: "**/jest-report.xml"
        testExecKey: "${{ github.event.inputs.testExecKey }}"
        projectKey: "${{ github.event.inputs.projectKey }}"
        testEnvironments: "NODE_20"
