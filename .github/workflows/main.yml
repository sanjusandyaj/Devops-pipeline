on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      testExecKey:
        description: 'Test Exec ID from Xray'
        default: ''
        required: true
        type: string
      projectKey:
        description: 'Project ID from Xray'
        default: ''
        required: true
        type: string

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]   # Use stable Node for Jest + Playwright

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    # ---------------------------
    #  INSTALL DEPENDENCIES
    # ---------------------------
    - name: Install Dependencies
      run: npm ci

    # ---------------------------
    #  RUN JEST UNIT TESTS
    # ---------------------------
    - name: Install Jest JUnit Reporter
      run: npm install --save-dev jest-junit

    - name: Run Jest Tests
      run: |
        npm test -- --ci --reporters=default --reporters=jest-junit
      env:
        JEST_JUNIT_OUTPUT: jest-report.xml

    - name: Show Jest Report
      run: cat jest-report.xml

    # ---------------------------
    #  RUN PLAYWRIGHT TESTS
    # ---------------------------
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Tests
      continue-on-error: true
      run: |
        PLAYWRIGHT_JUNIT_OUTPUT_NAME=playwright-report.xml \
        npx playwright test --reporter=junit

    - name: Show Playwright Report
      run: cat playwright-report.xml

    # ---------------------------
    #  UPLOAD TO XRAY
    # ---------------------------
    - name: Import Playwright Results to Xray
      uses: mikepenz/xray-action@v2.3.0
      with:
        username: ${{ secrets.JIRA_USERNAME }}
        password: ${{ secrets.JIRA_PASSWORD }}
        xrayCloud: "false"
        xrayBaseUrl: ${{ secrets.JIRA_BASEURL }}
        testFormat: "junit"
        testPaths: "playwright-report.xml"
        testExecKey: "${{ inputs.testExecKey }}"
        projectKey: "${{ inputs.projectKey }}"
        testEnvironments: "NODE_${{ matrix.node-version }}"

    # Optional: Upload Jest results too
    - name: Import Jest Results to Xray
      uses: mikepenz/xray-action@v2.3.0
      with:
        username: ${{ secrets.JIRA_USERNAME }}
        password: ${{ secrets.JIRA_PASSWORD }}
        xrayCloud: "false"
        xrayBaseUrl: ${{ secrets.JIRA_BASEURL }}
        testFormat: "junit"
        testPaths: "jest-report.xml"
        testExecKey: "${{ inputs.testExecKey }}"
        projectKey: "${{ inputs.projectKey }}"
        testEnvironments: "NODE_${{ matrix.node-version }}_JEST"
