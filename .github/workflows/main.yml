name: CI - Jest + Xray

on:
  workflow_dispatch:
    inputs:
      testExecKey:
        description: "Xray Execution Key"
        required: false
      projectKey:
        description: "Jira Project Key"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v3
      with:
        node-version: 20

    - run: npm install

    - name: Run Jest tests
      env:
        JEST_JUNIT_OUTPUT: jest-report.xml
      run: npm test -- --ci --reporters=default --reporters=jest-junit

    - run: cat jest-report.xml

    - name: Upload results to Xray
      uses: mikepenz/xray-action@v2.3.0
      with:
        username: ${{ secrets.JIRA_USERNAME }}
        password: ${{ secrets.JIRA_PASSWORD }}
        xrayCloud: "false"
        xrayBaseUrl: ${{ secrets.JIRA_BASEURL }}
        testFormat: "junit"
        testPaths: "**/jest-report.xml"
        testExecKey: "${{ github.event.inputs.testExecKey }}"
        projectKey: "${{ github.event.inputs.projectKey }}"
        testEnvironments: "NODE_20"
